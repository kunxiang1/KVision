name: Build Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"
      - ".github/patches/**"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch sources for MSVC
        shell: pwsh
        run: python .github/patches/apply_patches.py

      - name: Install Qt 5.15.2 (msvc2019_64)
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -o D:\a\qt --archives qtbase qtdeclarative qtmultimedia qttools qttranslations qtsvg
          echo "QT_DIR=D:\a\qt\5.15.2\msvc2019_64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download FFmpeg 6.1 shared (BtbN)
        shell: pwsh
        run: |
          $u = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n6.1-latest-win64-gpl-shared-6.1.zip"
          Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -UserAgent "curl"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $d = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_INC=$d\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "FFMPEG_LIB=$d\lib"     | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "FFMPEG_BIN=$d\bin"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch Hikvision SDK runtime DLLs (PyPI wheel, win64 V6.1.9.48)
        shell: pwsh
        run: |
          pip download HCNetSDK-python==1.0.0 --platform win_amd64 --only-binary=:all: --no-deps -d hikwheel
          Expand-Archive (Get-ChildItem hikwheel\*.whl).FullName -DestinationPath hiksdk
          $lib = (Resolve-Path hiksdk\*\HCNetSDK\Libs\windows).Path
          echo "HIK_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate import libraries (.lib) from SDK DLLs
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          $dumpbin = (Get-ChildItem $vs -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1).FullName
          $libexe  = (Get-ChildItem $vs -Recurse -Filter lib.exe     | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1).FullName
          Write-Host "dumpbin: $dumpbin"
          New-Item -ItemType Directory -Force -Path sdklib | Out-Null
          foreach ($dll in "HCNetSDK.dll", "PlayCtrl.dll") {
            & $dumpbin /EXPORTS "$env:HIK_LIB\$dll" | Out-File exports.txt
            $names = Get-Content exports.txt | ForEach-Object {
              if ($_ -match '^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') { $Matches[1] }
            } | Select-Object -Unique
            if (-not $names) { throw "no exports parsed from $dll" }
            Write-Host "$dll -> $($names.Count) exports"
            "EXPORTS`n" + ($names -join "`n") | Out-File -Encoding ascii "$dll.def"
            & $libexe "/def:$dll.def" "/machine:x64" "/out:sdklib\$($dll -replace '.dll','.lib')"
          }
          echo "HIK_SDKLIB=$((Resolve-Path sdklib).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Replace Linux SDK libs with Windows ones
        shell: pwsh
        run: |
          Remove-Item src\hikvision_sdk\lib\* -Force
          Copy-Item $env:HIK_SDKLIB\*.lib src\hikvision_sdk\lib\
          Get-ChildItem src\hikvision_sdk\lib | ForEach-Object { Write-Host $_.Name }

      - name: Configure & build
        shell: pwsh
        run: |
          Import-Module "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $env:PATH = "$env:QT_DIR\bin;$env:PATH"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_DIR" `
            -DFFMPEG_INC="$env:FFMPEG_INC" -DFFMPEG_LIB="$env:FFMPEG_LIB"
          cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "pkg"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = "build\Release\kvision.exe"
          if (-not (Test-Path $exe)) { throw "kvision.exe not built" }
          Copy-Item $exe $out\
          & "$env:QT_DIR\bin\windeployqt.exe" --release --qmldir src "$out\kvision.exe"
          # Hikvision SDK runtime (incl. HCNetSDKCom subdir)
          Copy-Item "$env:HIK_LIB\*" $out\ -Recurse -Force
          # FFmpeg runtime
          Copy-Item "$env:FFMPEG_BIN\*.dll" $out\
          Compress-Archive -Path "$out\*" -DestinationPath KVision-windows-x64.zip
          Get-ChildItem $out | Select-Object -First 40 | ForEach-Object { Write-Host $_.Name }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KVision-windows-x64
          path: KVision-windows-x64.zip
